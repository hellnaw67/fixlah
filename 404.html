<!doctype html>
<html lang="en-MY">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found — FixLah</title>
<link rel="icon" type="image/png" href="/brand/fixlah-mark.png">
<meta name="theme-color" content="#f4f2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)">
<style>
  :root{
    color-scheme: light dark;
    --paper:#f4f2ec; --text:#241f18; --muted:#726c60; --green:#0e6f4e; --on-green:#fff; --line:#e4ded2;
    --mono:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#141210; --text:#efeae0; --muted:#a49d8e; --green:#43bc86; --on-green:#08130d; --line:#322d25; }
  }
  *{box-sizing:border-box}
  body{margin:0; min-height:100vh; background:var(--paper); color:var(--text); font-family:var(--sans);
       display:grid; place-items:center; text-align:center; padding:24px; -webkit-font-smoothing:antialiased}
  .mark{width:60px; height:60px; border-radius:14px; background:var(--green); color:var(--on-green);
        display:grid; place-items:center; font-family:var(--mono); font-weight:700; font-size:1.7rem; margin:0 auto 22px}
  .code{font-family:var(--mono); font-size:.8rem; letter-spacing:.16em; text-transform:uppercase; color:var(--muted)}
  h1{font-size:clamp(1.7rem,5vw,2.4rem); letter-spacing:-.02em; margin:.4em 0 .3em}
  p{color:var(--muted); max-width:42ch; margin:0 auto 1.8em}
  a.btn{display:inline-flex; align-items:center; gap:.5em; background:var(--green); color:var(--on-green);
        text-decoration:none; font-weight:650; padding:.85em 1.4em; border-radius:12px}
</style>
</head>
<body>
  <div>
    <div class="mark">F</div>
    <div class="code">Error 404</div>
    <h1>We couldn’t find that page.</h1>
    <p>The link may be broken or the page may have moved. Let’s get you back to fixing things.</p>
    <a class="btn" href="/">← Back to FixLah</a>
  </div>
</body>
</html>
